# =========================================================================
# การตั้งค่า Nginx สำหรับระบบลงเวลาปฏิบัติงาน โรงพยาบาลสามชุก (IP: 10.2.0.13)
# =========================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    sendfile      on;
    keepalive_timeout 65;

    # 1. Web Frontend Server (พอร์ต 3001 HTTPS - โฟลเดอร์ Sam-attendance)
    server {
        listen       3001 ssl;
        server_name  10.2.0.13;

        # ใบรับรองความปลอดภัย SSL/TLS
        ssl_certificate      ssl/samchuk_hospital.crt;
        ssl_certificate_key  ssl/samchuk_hospital.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;

        # Virtual Directory: /Sam-attendance/
        location /Sam-attendance/ {
            alias D:/Sam-attendance/dist/;
            index index.html;
            try_files $uri $uri/ /Sam-attendance/index.html;
        }

        # Redirect root ไปที่ /Sam-attendance/
        location = / {
            return 301 https://10.2.0.13:3001/Sam-attendance/;
        }
    }

    # 2. Backend API Gateway Server (พอร์ต 3002 HTTPS - ส่งข้อมูล hosoffice & เครื่องสแกน)
    server {
        listen       3002 ssl;
        server_name  10.2.0.13;

        ssl_certificate      ssl/samchuk_hospital.crt;
        ssl_certificate_key  ssl/samchuk_hospital.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;

        location / {
            # ส่งต่อไปยัง ASP.NET Core Kestrel (x86)
            proxy_pass         http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
